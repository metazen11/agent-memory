name: agent-gate

# Posts a commit status `agent-gate` on the PR head SHA: success only if trusted
# issue comments carry, for the CURRENT head SHA, the lines
#   review: APPROVE <head_sha>
#   audit: PASS <head_sha>
# Both triggers run from the default branch with NO checkout of PR code, so a PR
# cannot edit its own gate. Logic lives in scripts/agent_gate.js (unit-tested).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: agent-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  agent-gate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (base/default branch only)
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const { evaluate } = require('./scripts/agent_gate.js');
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const sha = pr.head.sha;
            let verdict;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: number, per_page: 100,
              });
              verdict = evaluate(comments, sha);
            } catch (e) {
              verdict = { pass: false, reasons: [`error: ${e.message}`] };
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, context: 'agent-gate',
              state: verdict.pass ? 'success' : 'failure',
              description: (verdict.pass ? 'review + audit evidence present'
                : `missing: ${verdict.reasons.join(' | ')}`).slice(0, 140),
            });
            core.info(JSON.stringify(verdict));
