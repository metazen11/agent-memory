name: agent-gate

# A PR passes only if collaborators have posted, for the CURRENT head SHA, the
# two literal evidence lines (each on its own line, in any comment):
#   review: APPROVE <head_sha>
#   audit: PASS <head_sha>
# Evidence for an older SHA never satisfies it (a new push changes the SHA).
#
# issue_comment runs execute from the default branch and report against it, not
# the PR head, so on a comment we re-run the PR's latest pull_request run, which
# re-reads the comments and updates the check the PR actually shows.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  agent-gate:
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const sha = pr.head.sha;

            if (context.eventName === 'issue_comment') {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'agent-gate.yml', event: 'pull_request', head_sha: sha, per_page: 1,
              });
              if (!data.workflow_runs.length) {
                core.setFailed(`No pull_request run of agent-gate for ${sha} to re-run.`);
                return;
              }
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: data.workflow_runs[0].id });
              core.info(`Re-running agent-gate run ${data.workflow_runs[0].id} for ${sha}`);
              return;
            }

            const trusted = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const seen = (line) => comments.some((c) =>
              trusted.has(c.author_association) &&
              (c.body || '').split(/\r?\n/).some((l) => l.trim() === line));
            const missing = [`review: APPROVE ${sha}`, `audit: PASS ${sha}`].filter((l) => !seen(l));
            if (missing.length) {
              core.setFailed(`Missing evidence for head ${sha}: ${missing.join(' | ')}`);
            } else {
              core.info(`review + audit evidence present for ${sha}`);
            }
