name: ci-quality
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentmem
          POSTGRES_DB: agent_memory
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentmem -d agent_memory"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agentmem@127.0.0.1:5432/agent_memory
      ALLOW_TRUST_AUTH: 'true'
      EMBEDDING_MODEL: sentence-transformers/all-mpnet-base-v2
      ANVIL_FALLBACK_ENABLED: 'false'
      ANTHROPIC_API_KEY: ''
      OBSERVATION_LLM_MODEL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce promotion routes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = main ]; then test "$HEAD" = dev; test "$HEAD_REPO" = "$BASE_REPO"; fi
          if [ "$BASE" = dev ]; then test "$HEAD" != main; test "$HEAD" != dev; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test runtime
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
      - name: Lint changed Python and compile server
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          python scripts/ci_gate.py
      - name: Start disposable integration stage
        run: |
          printf 'DATABASE_URL=%s\nALLOW_TRUST_AUTH=true\n' "$DATABASE_URL" > .env
          python -m uvicorn app.main:app --host 127.0.0.1 --port 3377 > /tmp/api.log 2>&1 &
          python scripts/wait_for_health.py --timeout 300
      - name: Unit, hook and database integration tests
        run: python -m pytest tests/ -q --junitxml=/tmp/tests.xml
      - name: Produce tested release artifact
        if: github.event_name == 'push'
        run: |
          python scripts/build_release.py "$GITHUB_SHA" /tmp/release
          python -m pip freeze > /tmp/release/runtime-ci.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-${{ github.sha }}
          path: /tmp/release/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence-${{ github.run_id }}
          path: |
            /tmp/tests.xml
            /tmp/api.log
