name: contract-integrity

# Guards the contract's own files. Catches a contract that has been
# half-installed, made non-executable, or silently edited into a no-op.
#
# LIMIT, stated plainly: this verifies what is IN THE REPO. It cannot see
# whether any particular machine ran `git config core.hooksPath .githooks`
# — the server has no visibility into your local git config. Per-machine
# activation is covered by the git template + activate-all.sh instead.

on:
  push:
    branches: [dev, develop, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pre-push hook is present and executable
        run: |
          h=.githooks/pre-push
          [ -f "$h" ] || { echo "::error::$h is missing — the contract is not installed."; exit 1; }
          [ -x "$h" ] || { echo "::error::$h is not executable; git will silently skip it. Fix: chmod +x $h && git update-index --chmod=+x $h"; exit 1; }
          bash -n "$h" || { echo "::error::$h has a syntax error and would fail open."; exit 1; }
          echo "OK: $h present, executable, parses."

      - name: hook actually refuses a push to the production trunk
        run: |
          # Exercise the hook the way git does — feed it a ref update on stdin
          # — rather than trusting that the file merely exists.
          prod=main; git show-ref --verify --quiet refs/remotes/origin/main || prod=master
          out=$(echo "refs/heads/$prod $(git rev-parse HEAD) refs/heads/$prod 0000000000000000000000000000000000000000" \
                | .githooks/pre-push origin "$(git remote get-url origin 2>/dev/null || echo origin)" 2>&1) && rc=0 || rc=$?
          if [ "${rc:-0}" -eq 0 ]; then
            echo "::error::pre-push did NOT refuse a push to '$prod'. The contract is a no-op."
            echo "$out"
            exit 1
          fi
          echo "OK: hook refused a push to '$prod' (exit $rc)."

      - name: CONTRIBUTING documents the activation step
        run: |
          f=CONTRIBUTING.md
          [ -f "$f" ] || { echo "::error::$f missing — a blocked push would have no explanation."; exit 1; }
          grep -q 'core.hooksPath .githooks' "$f" || {
            echo "::error::$f does not document 'git config core.hooksPath .githooks'."; exit 1; }
          echo "OK: $f documents activation."
