# v5 pilot config — generated by v5_pilot_wizard.py

source_window_recent_rows: 15000
target_clean_rows: 5000
exclude_projects:
  - "test"
  - "my-repo"
  - "my-project"
  - "DailyDispatch.local"
  - "ws_b"
  - "lib"
  - "a"
  - "b"
  - "c"
exclude_project_patterns:
  - "agent-a*"
  - "ab-anvil-workspace*"
exclude_cwd_prefixes:
  - "/tmp/"
  - "/private/var/folders/"
  - "/var/folders/"
  - "/private/tmp/"
require_cwd_in_workspace: true
min_prompt_len_chars: 20
drop_continuation_prompts: true
continuation_prompt_pattern: "^(yes|ok|sure|go|yeah|y|n|no|do it|please|and|also|ok let's|let's|next|continue|more)\b"
strip_injected_blocks: true
require_tool_response: true
require_no_tool_error: true
require_prompt_text: true
dedup_key: "prompt_text+tool_input+cwd"
base_model: "Qwen/Qwen2.5-3B-Instruct"
run_mode: "smoke"
output_jsonl: "datasets/v5_pilot/train.jsonl"
output_audit_md: "datasets/v5_pilot/AUDIT.md"
